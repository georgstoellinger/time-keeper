services:
  db:
    image: postgres:16
    container_name: timekeeper-db
    environment:
      POSTGRES_DB: timekeeper
      POSTGRES_USER: timekeeper
      POSTGRES_PASSWORD: timekeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timekeeper -d timekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: timekeeper-backend:latest
    build: ./backend
    container_name: timekeeper-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/timekeeper
      SPRING_DATASOURCE_USERNAME: timekeeper
      SPRING_DATASOURCE_PASSWORD: timekeeper
    ports:
      - "8080:8080"

  frontend:
    image: timekeeper-frontend:latest
    build: ./frontend
    container_name: timekeeper-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

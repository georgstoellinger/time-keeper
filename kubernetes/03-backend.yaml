apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: timekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until pg_isready -h db -p 5432 -U timekeeper -d timekeeper; do
                echo "waiting for database...";
                sleep 2;
              done
      containers:
        - name: backend
          image: timekeeper-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/timekeeper
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: timekeeper-db
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timekeeper-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/categories
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/categories
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: timekeeper
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080

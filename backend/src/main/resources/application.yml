spring:
  application:
    name: time-keeper-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timekeeper}
    username: ${SPRING_DATASOURCE_USERNAME:timekeeper}
    password: ${SPRING_DATASOURCE_PASSWORD:timekeeper}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
